<!doctype html><meta charset="utf-8"><body><script type="module">
import * as faceapi from './face-api.esm.js';
window.ready = (async () => {
  faceapi.tf.setWasmPaths('/'); await faceapi.tf.setBackend('wasm'); await faceapi.tf.ready();
  await faceapi.nets.ssdMobilenetv1.loadFromUri('model');
  await faceapi.nets.faceLandmark68Net.loadFromUri('model');
  await faceapi.nets.faceRecognitionNet.loadFromUri('model');
  return faceapi.tf.getBackend();
})();
const load = (src) => new Promise((ok, err) => { const i = new Image(); i.onload = () => ok(i); i.onerror = err; i.src = src; });
const opt = () => new faceapi.SsdMobilenetv1Options({ minConfidence: 0.15 });
function padded(img) {  // same as web/js/face.js
  const p = Math.round(Math.max(img.width, img.height) * 0.2);
  const c = document.createElement("canvas"); c.width = img.width + 2 * p; c.height = img.height + 2 * p;
  const x = c.getContext("2d"); x.fillStyle = "#808080"; x.fillRect(0, 0, c.width, c.height); x.drawImage(img, p, p);
  return c;
}
const avg = (pts) => ({ x: pts.reduce((s, p) => s + p.x, 0) / pts.length, y: pts.reduce((s, p) => s + p.y, 0) / pts.length });
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
// Synthetic "hand over mouth" occluder (idea from NatOcc/RandOcc, Voo et al. CVPRW 2022):
// skin-coloured palm + fingers drawn over the mouth, colour sampled from the person's own cheek
window.synth = async (src, seed) => {
  let r = seed; const rnd = () => ((r = (r * 9301 + 49297) % 233280) / 233280);
  const img = await load(src); const c = padded(img); const x = c.getContext("2d");
  const det = await faceapi.detectSingleFace(c, opt()).withFaceLandmarks();
  if (!det) return null;
  const P = det.landmarks.positions;
  const mouth = avg(P.slice(48, 68)), nose = P[33], chin = P[8];
  const faceW = dist(P[2], P[14]), lowerH = dist(nose, chin);
  // skin colour from both cheeks
  const sample = (pt) => { const d = x.getImageData(Math.max(0, pt.x - 3), Math.max(0, pt.y - 3), 6, 6).data; let s = [0, 0, 0]; for (let i = 0; i < d.length; i += 4) { s[0] += d[i]; s[1] += d[i + 1]; s[2] += d[i + 2]; } return s.map((v) => v / (d.length / 4)); };
  const ck = [sample({ x: (P[3].x + P[31].x) / 2, y: (P[3].y + P[31].y) / 2 }), sample({ x: (P[13].x + P[35].x) / 2, y: (P[13].y + P[35].y) / 2 })];
  let col = ck[0].map((v, i) => (v + ck[1][i]) / 2);
  const k = 0.8 + rnd() * 0.35; col = col.map((v) => Math.min(255, v * k));
  const rgb = (m = 1, a = 1) => `rgba(${col.map((v) => Math.round(Math.min(255, v * m))).join(",")},${a})`;
  const coverNose = rnd() < 0.35;
  const cy = coverNose ? (mouth.y + nose.y) / 2 : mouth.y + lowerH * 0.1;
  const ang = (rnd() - 0.5) * 0.7, side = rnd() < 0.5 ? -1 : 1;
  x.save(); x.translate(mouth.x + (rnd() - 0.5) * faceW * 0.1, cy); x.rotate(ang);
  x.filter = "blur(1px)";
  const pw = faceW * (0.55 + rnd() * 0.25), ph = lowerH * (coverNose ? 1.3 : 0.9) * (0.9 + rnd() * 0.3);
  // palm
  const g = x.createRadialGradient(0, 0, pw * 0.1, 0, 0, pw * 0.7); g.addColorStop(0, rgb(1.05)); g.addColorStop(1, rgb(0.85));
  x.fillStyle = g; x.beginPath(); x.ellipse(0, 0, pw / 2, ph / 2, 0, 0, Math.PI * 2); x.fill();
  // 4 fingers going sideways across the face
  const fl = faceW * (0.35 + rnd() * 0.2), ft = ph / 4.3;
  for (let i = 0; i < 4; i++) {
    const fy = -ph / 2 + ft * 0.6 + i * (ph - ft * 1.2) / 3, len = fl * (i === 0 || i === 3 ? 0.8 : 1);
    x.fillStyle = rgb(0.95 + rnd() * 0.1); x.beginPath();
    x.roundRect(side > 0 ? pw * 0.2 : -pw * 0.2 - len, fy - ft / 2, len, ft, ft / 2); x.fill();
    x.strokeStyle = rgb(0.65, 0.5); x.lineWidth = Math.max(1, ft * 0.08); x.stroke();
  }
  // thumb
  x.fillStyle = rgb(0.92); x.beginPath(); x.roundRect(-side * pw * 0.15 - ft * 0.5, ph * 0.15, ft, ph * 0.45, ft / 2); x.fill();
  x.restore();
  const d2 = await faceapi.detectSingleFace(c, opt()).withFaceLandmarks().withFaceDescriptor();
  const out = { found: d2 ? 1 : 0, d: d2 ? Array.from(d2.descriptor) : null };
  if (window.KEEP) out.png = c.toDataURL("image/jpeg", 0.8);
  return out;
};
</script>
